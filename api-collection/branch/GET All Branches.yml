info:
  name: GET All Branches
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/schools/{{schoolId}}/branches"
  auth: inherit
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
