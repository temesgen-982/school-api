info:
  name: PATCH Update School
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/schools/{{schoolId}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Bright Future Renamed"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
