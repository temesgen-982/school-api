info:
  name: DELETE Deactivate Branch
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/schools/{{schoolId}}/branches/{{branchId}}"
  auth: inherit
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
