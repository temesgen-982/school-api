spring:
  application:
    name: api

  # PostgreSQL connection (database is provisioned by compose.yaml)
  datasource:
    url: jdbc:postgresql://localhost:5432/school
    username: school
    password: school

  jpa:
    # Schema is managed by Flyway migrations, never by Hibernate
    hibernate:
      ddl-auto: none
    # Don't keep the JPA session open for the whole HTTP request
    open-in-view: false

# JWT login and bearer-token authentication
auth:
  jwt:
    # HS256 signing key (min 32 chars), read from AUTH_JWT_SECRET — never commit
    # a real secret here. When empty, an ephemeral key is generated at startup
    # and previously issued tokens stop working on restart (dev-friendly).
    secret: ${AUTH_JWT_SECRET:}
    # Access-token lifetime
    ttl: 1h
  # First platform admin, seeded only while the users table is empty
  admin:
    username: admin
    password: admin # change this outside local development

# Expose only health/info on the actuator over HTTP
management:
  endpoints:
    web:
      exposure:
        include: health,info
