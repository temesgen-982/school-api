info:
  name: GET One User
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}"
  auth: inherit
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
