# Render Blueprint — infra as code. Synced on git push.
# Secrets use `sync: false`: the blueprint declares the variable EXISTS, and
# the actual value is pasted once in the Render dashboard (Env Groups or
# service env vars). Values are never committed.
services:
  - type: web
    name: school-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      # Supabase connection string, e.g.
      # jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # HS256 signing key, >= 32 chars (openssl rand -base64 48).
      # Without it every restart invalidates all issued tokens.
      - key: AUTH_JWT_SECRET
        sync: false
      # Seeded by AdminUserSeeder on FIRST boot only, while users table is
      # empty. Set before the first deploy.
      - key: AUTH_ADMIN_PASSWORD
        sync: false
