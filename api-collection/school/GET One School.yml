info:
  name: GET One School
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/schools/{{schoolId}}"
  auth: inherit
  headers:
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
