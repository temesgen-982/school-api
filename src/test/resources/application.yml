spring:
  # Tests run against an already-running database, so don't start containers
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/school
    username: school
    password: school

# Tests run with an ephemeral signing key (no auth.jwt.secret) and the
# default seeded admin, seeded only when the users table is empty
auth:
  jwt:
    ttl: 1h
  admin:
    username: admin
    password: admin
